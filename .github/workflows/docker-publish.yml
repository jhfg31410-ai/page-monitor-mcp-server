name: Publish Docker image to GHCR

on:
  push:
    branches: [main]
    paths:
      - 'server.py'
      - 'engine.py'
      - 'Dockerfile'
      - 'server.json'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/jhfg31410-ai/page-monitor-mcp-server:0.1.0
            ghcr.io/jhfg31410-ai/page-monitor-mcp-server:latest
